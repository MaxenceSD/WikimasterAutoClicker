
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="popup.css" rel="stylesheet">
</head>

<body>
    <div class="state-card">
        <div class="state-label">État de l'automatisation</div>
        <div class="state-line">
            <span id="stateDot" class="dot"></span>
            <span id="stateText">Désactivée</span>
        </div>
    </div>

    <button id="toggle">▶ &nbsp; Activer l'automatisation</button>

    <div class="log-header">
        <span class="log-title">Journal d'activité</span>
        <span class="live-badge" id="logBadge">En attente</span>
    </div>

    <div class="log-panel" id="logPanel">
        <div class="empty" id="emptyLog">
            Aucune activité pour le moment.<br>
            Active l'automatisation pour commencer.
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
