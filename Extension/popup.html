
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 240px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        h3 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #start {
            background: #22c55e;
            color: black;
        }

        #stop {
            background: #ef4444;
            color: white;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h3>Clic automatique</h3>

    <button id="start">Démarrer</button>
    <button id="stop">Arrêter</button>

    <div id="status">En attente</div>

    <script src="popup.js"></script>
</body>
</html>
